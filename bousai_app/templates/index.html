{% extends "base.html" %}

{% block content %}
<div class="home-panel shelter-map-panel">
  <div class="section-title">
    <span class="icon">📍</span>
    <span>避難所マップ</span>
  </div>
  <div id="shelterMap" class="map-box"></div>
</div>

<div class="home-panel weather-panel">
  <div class="weather-header">
    <div class="section-title weather-title">
      <span class="icon weather-icon">☁️</span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <button class="refresh-badge" type="button">↻ 10分おき自動更新</button>
  </div>

  <div id="weatherContent" class="weather-content">
    <p>読み込み中...</p>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                const weatherContent = document.getElementById('weatherContent');
                weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="warning-list">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li><span class="dot"></span>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<div class="status-ok">✓ 現在、警報・注意報は発表されていません</div>';
        }

        weatherContent.innerHTML = `
            <div class="weather-location">● ${data.area_name || '青森市'}</div>
            ${warningsHtml}
            <div class="weather-meta">◔ データ取得時刻：${data.last_fetch_time || '更新中...'}</div>
            <div class="weather-meta">◔ 気象庁発表時刻：${data.report_time || '不明'}</div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
